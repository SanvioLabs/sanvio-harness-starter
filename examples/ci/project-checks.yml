# CI for a code repo you keep in projects/. Copy it into that repo as
# .github/workflows/checks.yml.
#
# It's safe on an empty repo. Each job looks for the file it needs
# (pyproject.toml, package.json) and skips with a notice when it isn't there,
# so a new repo gets green, honest CI on day one and checks more as it grows.
# Once a job has run on a pull request, make it a required check, using the
# name from that run.
#
# When the repo has a real command for something, swap the guard for the
# command. A step written against a command that doesn't exist yet only
# teaches people to ignore red.
name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Look for a Python project
        id: detect
        run: |
          if [ -f pyproject.toml ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No pyproject.toml, so the Python checks skip."
          fi
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        if: steps.detect.outputs.found == 'true'
      - name: Install
        if: steps.detect.outputs.found == 'true'
        run: uv sync --dev
      - name: Lint and format
        if: steps.detect.outputs.found == 'true'
        run: |
          if uv run ruff --version >/dev/null 2>&1; then
            uv run ruff check . && uv run ruff format --check .
          else
            echo "::notice::ruff isn't a dev dependency, so lint skips."
          fi
      # Coverage runs once pytest-cov is a dev dependency. The bar is
      # fail_under under [tool.coverage.report] in the project's
      # pyproject.toml; with none set, coverage is reported and never fails
      # the job.
      - name: Tests
        if: steps.detect.outputs.found == 'true'
        run: |
          if uv run pytest --version >/dev/null 2>&1; then
            if uv run python -c "import pytest_cov" >/dev/null 2>&1; then
              uv run pytest --cov
            else
              echo "::notice::pytest-cov isn't a dev dependency, so coverage skips."
              uv run pytest
            fi
          else
            echo "::notice::pytest isn't a dev dependency, so tests skip."
          fi

  node:
    name: node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Look for a Node project
        id: detect
        run: |
          if [ -f package.json ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No package.json, so the Node checks skip."
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.detect.outputs.found == 'true'
        with:
          node-version: lts/*
      - name: Install
        if: steps.detect.outputs.found == 'true'
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      # --if-present is the guard: a script the project hasn't defined yet is
      # skipped rather than failing the build. Coverage belongs in the
      # project's own test script, with its bar.
      - name: Lint, types, tests, build
        if: steps.detect.outputs.found == 'true'
        run: |
          npm run --if-present lint
          npm run --if-present typecheck
          npm run --if-present test
          npm run --if-present build
