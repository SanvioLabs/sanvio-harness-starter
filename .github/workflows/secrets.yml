# A secret scan over the whole history, on every push to main and every pull
# request. The pre-commit hook checks for secrets first, but
# `git commit --no-verify` skips the hook. This can't be skipped.
#
# It uses the gitleaks CLI rather than gitleaks/gitleaks-action, because the
# action needs a paid licence for a repo owned by an organisation and fails
# without one.
name: Secrets

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history: a secret deleted in a later commit is still live
          # until it's rotated.
          fetch-depth: 0
      - name: Install gitleaks
        id: install
        # The binary is checked against a checksum written here before it
        # runs, so a release asset swapped after publishing can't run in your
        # CI. To move the version, take the linux_x64 line from that release's
        # gitleaks_<version>_checksums.txt and change VERSION and SHA256
        # together.
        run: |
          VERSION=8.30.1
          SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - name: gitleaks
        id: scan
        run: |
          CONFIG=""
          [ -f .gitleaks.toml ] && CONFIG="--config .gitleaks.toml"
          /tmp/gitleaks detect --source . $CONFIG --redact --verbose --exit-code 1
      - name: What to do
        if: failure() && steps.scan.outcome == 'failure'
        run: |
          echo "::error::A secret is in this repo's history. Rotate it first: deleting the commit doesn't un-leak it. Then remove it and keep the value in your platform's secret store."
      - name: What to do about the download
        if: failure() && steps.install.outcome == 'failure'
        run: |
          echo "::error::gitleaks didn't download, or didn't match its checksum, so the scan didn't run. Don't remove the check. Compare SHA256 in this workflow with the release's checksums file: a mismatch on an unchanged VERSION means the release asset changed."
