# The same checks as the pre-commit hook, run on every push and pull request,
# so a check that someone skipped locally still runs before anything merges.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: checks (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Tests
        run: python3 -m unittest discover -s tests -v
      - name: The example's proposals pass their gate
        run: python3 examples/proposal/gates/proposal_gate.py
      - name: Every file name in the Markdown is a link
        run: python3 scripts/link_files.py --check
      - name: Setup check
        run: |
          git config core.hooksPath .githooks
          python3 scripts/check_setup.py

  # The TypeScript example on the lowest Node it supports. The last step runs its
  # Python test here, where Node is new enough that the test can't skip.
  typescript:
    name: typescript example (node 22.18.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.18.0
      - name: Install
        working-directory: examples/typescript
        run: npm ci
      - name: Typecheck
        working-directory: examples/typescript
        run: npm run typecheck
      - name: Tests
        working-directory: examples/typescript
        run: npm test
      - name: The harness test runs the example and sees it fail when broken
        run: python3 -m unittest tests.test_typescript_example -v
