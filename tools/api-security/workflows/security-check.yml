# SPEC-034 security check. Copied in by the api-security tool's apply.py at `enforced`.
#
# Runs the pull request's code with no secrets and a read-only token. A pull request could edit
# this file to pass itself, which is why the file is guarded: changing it needs a commit signed by
# a key in the base branch's security/allowed_signers (security-approval.yml, which the pull
# request cannot edit).
# No `paths:` filter, ever: this is a required check, and a required check that does not run
# never reports.
name: security-check

on:
  pull_request:

permissions:
  contents: read

jobs:
  security-check:
    name: security-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # The check imports the handler modules, and they import the project's dependencies.
      - name: Install the project's dependencies
        run: |
          if [ -f uv.lock ]; then uv sync --frozen
          elif [ -f pyproject.toml ]; then uv sync
          else uv venv
          fi
          # a requirements.txt beside a pyproject.toml is installed too; uv sync reads neither
          if [ -f requirements.txt ]; then uv pip install -r requirements.txt; fi

      - name: Declarations, deployed routes and the public snapshot
        run: uv run python -m security.api_security.check

      - name: Every suppression of the identity rules carries a reason
        run: uv run python -m security.api_security.markers

      # --strict and no size limit: semgrep otherwise skips a file it cannot parse, or one over
      # 1 MB, and exits 0.
      # Local rules only. Never `--config auto` and never `semgrep login`: the hosted platform
      # receives code and is not an Approved System.
      - name: No identity read from request input
        run: uvx semgrep@1.175.0 scan --metrics=off --error --strict --max-target-bytes 0 --config security/semgrep/identity-from-request.yml --exclude security/semgrep .

      - name: Generated authorization tests
        run: uv run --with pytest python -m pytest -p security.api_security.authz -p no:cacheprovider security/fixtures.py
